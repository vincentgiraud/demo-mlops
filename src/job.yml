$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: .
command: >-
  python train-model-parameters.py
  --training_data ${{inputs.training_data}}
  --reg_rate ${{inputs.reg_rate}}
  --metrics_output ${{outputs.metrics_output}}
inputs:
  training_data:
    type: uri_folder
    path: azureml:diabetes-dev-folder@latest
  reg_rate: 0.01
outputs:
  metrics_output:
    type: uri_folder
environment: azureml://registries/azureml/environments/sklearn-1.5/versions/54
compute: azureml:aml-cluster
experiment_name: diabetes-training
display_name: diabetes-train-command
description: diabetes training job
