name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
     branches:
       - main
     paths:
       - 'src/train-model-parameters.py'
       - 'src/job.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  train-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list --query "[?starts_with(name,'rg-demo-dev-')].name | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-demo-dev- found." >&2
            exit 1
          fi

          WS_NAME=$(az ml workspace list --resource-group "$RG_NAME" --query "[?starts_with(name,'mlw-demo-dev-')].name | [0]" -o tsv)
          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-demo-dev- found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in dev
        id: train
        run: |
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}"
          echo "Running Azure ML job: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder@latest \
            --stream

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Download dev training outputs
        id: download
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          mkdir -p downloaded-job
          az ml job download --name "$JOB_NAME" --output-name metrics_output --download-path downloaded-job

          METRICS_FILE=$(find downloaded-job -name metrics.json -print -quit)
          if [ -z "$METRICS_FILE" ]; then
            echo "Downloaded files:" >&2
            find downloaded-job -maxdepth 5 -type f | sort >&2 || true
            echo "No metrics.json found in downloaded job outputs." >&2
            exit 1
          fi

          echo "metrics_file=$METRICS_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract dev metrics from output artifact
        id: parse-metrics
        run: |
          METRICS_FILE="${{ steps.download.outputs.metrics_file }}"
          if [ ! -f "$METRICS_FILE" ]; then
            echo "No metrics file found to parse." >&2
            exit 1
          fi

          ACC=$(python -c "import json; print(json.load(open(r'$METRICS_FILE', encoding='utf-8'))['accuracy'])")
          AUC=$(python -c "import json; print(json.load(open(r'$METRICS_FILE', encoding='utf-8'))['auc'])")

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment dev metrics on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';

            const prNumber = context.payload.pull_request.number;

            let body = '✅ Dev training workflow completed.';
            if (acc || auc) {
              body += '\n\n**Dev evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be read from the Azure Machine Learning job output. Check the job run for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
