name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
     branches:
       - main
     paths:
       - 'src/**'
       - 'tests/**'
       - 'requirements.txt'
       - 'pytest.ini'
       - '.github/workflows/train-dev.yml'

permissions:
  contents: read
  pull-requests: write

env:
  MIN_ACCURACY: '0.75'
  MIN_AUC: '0.80'

jobs:
  python-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

  train-dev:
    needs: python-quality
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list --query "[?starts_with(name,'rg-demo-dev-')].name | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-demo-dev- found." >&2
            exit 1
          fi

          WS_NAME=$(az ml workspace list --resource-group "$RG_NAME" --query "[?starts_with(name,'mlw-demo-dev-')].name | [0]" -o tsv)
          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-demo-dev- found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in dev
        id: train
        run: |
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}"
          echo "Running Azure ML job: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder@latest

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for dev training job
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          for attempt in {1..120}; do
            STATUS=$(az ml job show --name "$JOB_NAME" --query status -o tsv)
            echo "Azure ML job status: $STATUS"

            case "$STATUS" in
              Completed)
                exit 0
                ;;
              Failed|Canceled|NotResponding)
                echo "Azure ML job finished unsuccessfully: $STATUS" >&2
                exit 1
                ;;
            esac

            sleep 15
          done

          echo "Timed out waiting for Azure ML job: $JOB_NAME" >&2
          exit 1

      - name: Download dev training outputs
        id: download
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          mkdir -p downloaded-job
          az ml job download --name "$JOB_NAME" --output-name metrics_output --download-path downloaded-job

          METRICS_FILE=$(find downloaded-job -name metrics.json -print -quit)
          if [ -z "$METRICS_FILE" ]; then
            echo "Downloaded files:" >&2
            find downloaded-job -maxdepth 5 -type f | sort >&2 || true
            echo "No metrics.json found in downloaded job outputs." >&2
            exit 1
          fi

          echo "metrics_file=$METRICS_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract dev metrics from output artifact
        id: parse-metrics
        run: |
          METRICS_FILE="${{ steps.download.outputs.metrics_file }}"
          if [ ! -f "$METRICS_FILE" ]; then
            echo "No metrics file found to parse." >&2
            exit 1
          fi

          ACC=$(python -c "import json; print(json.load(open(r'$METRICS_FILE', encoding='utf-8'))['accuracy'])")
          AUC=$(python -c "import json; print(json.load(open(r'$METRICS_FILE', encoding='utf-8'))['auc'])")

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Enforce model quality gate
        id: model-gate
        continue-on-error: true
        run: |
          python src/validate_metrics.py \
            --metrics-file "${{ steps.download.outputs.metrics_file }}" \
            --min-accuracy "$MIN_ACCURACY" \
            --min-auc "$MIN_AUC"

      - name: Comment dev metrics on pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';
            const gateOutcome = '${{ steps.model-gate.outcome }}';
            const gatePassed = gateOutcome === 'success';

            const prNumber = context.payload.pull_request.number;

            let body = gatePassed
              ? '✅ Dev training and model quality gate completed.'
              : '❌ Dev training completed, but the model quality gate did not pass.';
            if (acc || auc) {
              body += '\n\n**Dev evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be read from the Azure Machine Learning job output. Check the job run for details.';
            }

            body += '\n\n**Acceptance criteria**';
            body += '\n- Accuracy ≥ ${{ env.MIN_ACCURACY }}';
            body += '\n- AUC ≥ ${{ env.MIN_AUC }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Fail when model quality gate does not pass
        if: steps.model-gate.outcome == 'failure'
        run: |
          echo "Model quality gate failed." >&2
          exit 1
